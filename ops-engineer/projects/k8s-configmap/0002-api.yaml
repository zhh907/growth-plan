apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  MESSAGE: "hello from api v1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args:
          - -text=$(MESSAGE)
          env:
          - name: MESSAGE
            valueFrom:
              configMapKeyRef:
                name: api-config
                key: MESSAGE
          ports:
          - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 5678